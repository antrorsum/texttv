[project]
name = "texttv"
version = "0.1.0"
description = "A Python application to parse and clean data from Sweden SVT TextTV REST API"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "httpx>=0.25.0",
    "beautifulsoup4>=4.12.0",
    "pydantic>=2.4.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
]

[project.scripts]
texttv = "texttv.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.7.0",
    "ruff>=0.0.287",
]

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src/texttv"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "pytest-cov>=7.0.0",
]
